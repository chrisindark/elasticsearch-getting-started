cluster.name: "docker-cluster"
node.name: node-1
network.host: 0.0.0.0
http.port: 9201
transport.port: 9301

# Create a new cluster with the current node only
# Additional nodes can still join the cluster later
discovery.type: multi-node
discovery.seed_hosts:
  - es02:9302
  - es03:9303

# After the cluster forms successfully for the first time, remove the cluster.initial_master_nodes setting from each node’s configuration.
# Do not use this setting when restarting a cluster or adding a new node to an existing cluster.
cluster.initial_master_nodes:
  - node-1
#   - node-2
#   - node-3

